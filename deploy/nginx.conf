# HTTP rejim (ichki tarmoq yoki TLS tashqarida, masalan tashqi load balancer ortida).
# HTTPS uchun nginx.tls.conf dan foydalaning (deploy/README.md).
server {
  listen 80;
  server_name _;

  # MAX_UPLOAD_MB (standart 10) dan biroz kattaroq
  client_max_body_size 12m;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    expires 7d;
  }

  # Vite fayllari nomida hash bor — uzoq keshlash mumkin
  # (location ichida add_header ishlatilmaydi: u server darajasidagi sarlavhalarni bekor qiladi)
  location /assets/ {
    expires 30d;
  }

  location / {
    try_files $uri /index.html;
    expires -1;  # index.html keshlanmaydi
  }
}
